name: Daily Pitcher Database Update

# 毎朝5:00 JST (UTCの20:00) に自動実行する設定
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: # GitHub画面から手動で実行できるボタンも追加

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Run update script
        run: python update_db.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pitcher_db.json
          git commit -m "Auto-update pitcher database ⚾" || echo "No changes to commit"
          git push
